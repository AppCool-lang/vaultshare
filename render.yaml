# Déploiement backend sur Render (https://render.com)
# Importez ce fichier dans Render → New → Blueprint, ou renseignez manuellement :
#   Root Directory: backend | Build: npm install | Start: node server.js
services:
  - type: web
    name: vaultshare-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        value: https://vaultshare.pages.dev
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
